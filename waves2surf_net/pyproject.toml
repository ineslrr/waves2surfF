[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waves2surf-net"
version = "0.1.0"
description = "Waves2SurfNet maps 2-D ocean surface fields to velocity"
requires-python = ">=3.10"
dependencies = [
  "netCDF4>=1.6",
  "numpy>=1.24",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
include = ["ocean_velocity*"]
